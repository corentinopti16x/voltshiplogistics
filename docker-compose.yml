services:
  web:
    build: .
    env_file:
      - path: .env
        required: false
      - path: .env.local
        required: false
    ports:
      - "3000:3000"
    restart: unless-stopped

  cron:
    build:
      context: .
      dockerfile: Dockerfile.cron
    env_file:
      - path: .env
        required: false
      - path: .env.local
        required: false
    environment:
      APP_URL: http://web:3000
    depends_on:
      - web
    restart: unless-stopped
